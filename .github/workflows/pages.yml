# Publishes the web app to GitHub Pages (https://elliemhwu.github.io/selah/)
# whenever main changes. Only the app's files are published; every user's
# data stays on their own device (ADR 0025).
name: Publish the app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer push replaces a waiting one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NX_DAEMON: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm nx run-many -t test -p web finance-core shared-utils shared-types

      - name: Build for /selah/
        run: pnpm nx run web:build --base-href=/selah/

      # GitHub Pages answers unknown paths with 404.html, so a link straight to
      # /selah/records still opens the app, which then routes it.
      - name: Add the fallback page
        run: cp dist/apps/web/browser/index.html dist/apps/web/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/apps/web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
