@if (storageFailed()) {
  <div class="offline" role="alert">
    @if (apiBuild) {
      <span i18n="@@shell.serverFailed">Couldn't load the data from the server. Check that the API is running, then try again.</span>
    } @else {
      <span i18n="@@shell.storageFailed">Couldn't open the data on this device. Try again, or reload the app.</span>
    }
    <button type="button" class="btn btn-quiet" (click)="retry()" i18n="@@action.retry">Try again</button>
  </div>
}

<main [class.form]="onForm()">
  <router-outlet />
</main>

<selah-toast-outlet />

@if (!onForm()) {
  <nav class="bottom-nav" i18n-aria-label="@@nav.label" aria-label="Main">
    @for (item of nav; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.path === '/' }"
        #link="routerLinkActive"
        [attr.aria-current]="link.isActive ? 'page' : null"
      >
        <selah-icon [name]="item.icon" />
        <span class="label">{{ item.label }}</span>
      </a>
    }
  </nav>
}
