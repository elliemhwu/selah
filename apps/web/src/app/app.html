@if (offline()) {
  <div class="offline" role="status">
    <span i18n="@@shell.offline">Can't reach the server. Your data may be out of date.</span>
    <button type="button" class="btn btn-quiet" (click)="retry()" i18n="@@action.retry">Try again</button>
  </div>
}

<main [class.form]="onForm()">
  <router-outlet />
</main>

<selah-toast-outlet />

@if (!onForm()) {
  <nav class="bottom-nav" i18n-aria-label="@@nav.label" aria-label="Main">
    @for (item of nav; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.path === '/' }"
        #link="routerLinkActive"
        [attr.aria-current]="link.isActive ? 'page' : null"
      >
        <selah-icon [name]="item.icon" />
        <span class="label">{{ item.label }}</span>
      </a>
    }
  </nav>
}
